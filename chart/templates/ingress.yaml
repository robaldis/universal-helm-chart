{{- $namespace := .Release.Namespace -}}
{{- range $key, $value := .Values.deployments }}
{{- if $value.ingress }}
{{- $host := include "ingress.host" (dict "ingress" $value.ingress "baseDomain" $.Values.baseDomain) | trim -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}-ingress
  namespace: {{ $namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: traefik
  rules: 
  - host: {{ $host }} 
    http: 
      paths: 
      - backend: 
          service: 
            name: {{ $key }}
            port: 
              number: 80
        path: / 
        pathType: Prefix 
  tls:
  - hosts:
    - {{ $host }}
    secretName: {{ $key }}-robertaldis-{{ $value.ingress.cert_env }}-tls
---
{{- end }}
{{- end }}
