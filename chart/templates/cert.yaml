{{- $namespace := .Release.Namespace -}}
{{- range $key, $value := .Values.deployments }}
{{- if $value.ingress }}
{{- $host := include "ingress.host" (dict "ingress" $value.ingress "baseDomain" $.Values.baseDomain) | trim -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $key }}-robertaldis-{{ $value.ingress.cert_env }}
  namespace: {{ $namespace }}
spec:
  secretName: {{ $key }}-robertaldis-{{ $value.ingress.cert_env }}-tls
  issuerRef:
    name: robertaldis-{{ $value.ingress.cert_env }}
    kind: ClusterIssuer
  commonName: {{ $host | quote}}
  dnsNames:
  - {{ $host | quote}}
---
{{- end }}
{{- end }}
